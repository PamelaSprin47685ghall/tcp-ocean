# 400 ms RTT profile (spec testbed): 200 ms one-way each direction, 1 Gbit shared
# link, 4 Mbit/s leaky-bucket shaper per IPv4 TCP/UDP 5-tuple, 32 kB burst.
# Used by PROFILE=rtt400 and tests/e2e/calibrate_profile.sh. Not a campaign.
owd_ms=200
rate_mbit=1000
loss=0
seed=7
tuple_mbit=4
tuple_bucket_bytes=32000
# Defaults if omitted: tuple_mode=shaper, loss_point=before.
# The 32 kB burst is real credit (virtual-time bucket). This is the network
# model; the client --tuple-mbit / UPLINK_PACE flags in run.sh are independent.
