# Asymmetric dedicated line: 20 Mbit/s uplink (to_far), 200 Mbit/s downlink
# (to_near), 20 ms one-way each direction unless run.sh argv overrides owd.
# Used by PROFILE=asym20_200. rate_mbit is only the fallback if a per-direction
# key is omitted. The symmetric 20/200 and rtt400 matrices are unchanged.
owd_ms=20
rate_mbit=200
rate_to_far_mbit=20
rate_to_near_mbit=200
loss=0
seed=7
# Defaults if omitted: tuple_mode=shaper, loss_point=before, no per-tuple cap.
